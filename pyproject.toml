[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3-sc"
# Single source of truth: src/m3/__init__.py (see [tool.hatch.version] below)
dynamic = ["version"]
description = "Multimodal, multi-batch, condition-aware single-cell model with donor-level disease prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CSB Yang Laboratory" }]
keywords = [
    "single-cell", "multiomics", "CITE-seq", "batch-integration",
    "patient-prediction", "variational-autoencoder", "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# torch arrives transitively via captum, so `pip install m3-sc` works unaided.
# Only users who need a specific CUDA build install torch themselves first.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "anndata",
    "h5py",
    "scikit-learn",
    "scanpy",
    "tqdm",
    "captum",
    # scanpy's neighbour graph (sc.pp.neighbors, then sc.tl.umap) fails on 8,192
    # cells or more with two releases a fresh install would otherwise get:
    # umap-learn 0.6.0 with any scanpy, and pynndescent 0.7 with the scanpy that
    # Python 3.10 and 3.11 are held to (scanpy 1.12 needs Python 3.12). Both come
    # in through scanpy. The first line lets go by itself at umap-learn 0.6.1.
    "umap-learn!=0.6.0",
    'pynndescent<0.7; python_version < "3.12"',
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/PYangLab/M3"
Documentation = "https://pyanglab.github.io/M3/"
Repository = "https://github.com/PYangLab/M3"

[tool.hatch.version]
path = "src/m3/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/m3"]

[tool.hatch.build.targets.sdist]
include = ["/src/m3", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/m3/_engine"]
